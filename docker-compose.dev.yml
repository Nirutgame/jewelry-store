services:
  db:
    image: postgres:16
    container_name: jewelry-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jewelry_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jewelry_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: jewelry-app-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/jewelry_store?schema=public
      NEXTAUTH_SECRET: dev-secret-key-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-your_cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-your_api_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-your_api_secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-your_resend_api_key}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@lumiere-jewelry.com}
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN:-your_line_notify_token}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "npm install && npx prisma generate && npx prisma db push && node prisma/seed-category.js && node prisma/seed-products.js && npm run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dev:
