services:
  db:
    image: postgres:16
    container_name: jewelry-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jewelry_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d jewelry_store"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-bookworm-slim
    container_name: jewelry-app-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/jewelry_store?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      command: >
        sh -c "apt-get update -qq && apt-get install -y -qq openssl ca-certificates 2>/dev/null && npm install --legacy-peer-deps && npx prisma generate && npx prisma db push && node prisma/seed.js && node prisma/seed-category.js && node prisma/seed-products.js && npm run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dev:
