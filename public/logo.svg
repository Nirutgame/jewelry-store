<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>
  <!-- Diamond icon -->
  <g transform="translate(4, 8)">
    <polygon points="24,0 36,14 24,36 12,14" fill="url(#gold)" stroke="#B8860B" stroke-width="0.5"/>
    <polygon points="24,4 32,14 24,30 16,14" fill="none" stroke="#FFF8DC" stroke-width="0.5" opacity="0.4"/>
    <line x1="24" y1="0" x2="24" y2="36" stroke="#B8860B" stroke-width="0.3" opacity="0.3"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="12" cy="12" r="1" fill="#FFD700" opacity="0.6"/>
  <circle cx="38" cy="10" r="0.8" fill="#FFD700" opacity="0.4"/>
  <circle cx="14" cy="38" r="0.7" fill="#FFD700" opacity="0.5"/>
  <!-- Text -->
  <text x="52" y="34" font-family="'Playfair Display', 'Noto Sans Thai', serif" font-size="26" font-weight="700" fill="url(#goldText)" letter-spacing="3">Lumière</text>
  <text x="52" y="48" font-family="'Inter', sans-serif" font-size="9" fill="#B8860B" letter-spacing="6" font-weight="300">JEWELRY</text>
</svg>
